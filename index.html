<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Shared Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIkjMl2I5lqOSeJKkFEosMd7e98Uk2aLw",
      authDomain: "louis-hey-pig.firebaseapp.com",
      databaseURL: "https://louis-hey-pig-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "louis-hey-pig",
      storageBucket: "louis-hey-pig.firebasestorage.app",
      messagingSenderId: "1055726354389",
      appId: "1:1055726354389:web:cf7a06b1c2dea89292875c",
      measurementId: "G-SFX2RCCRB9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
  </script>

  <style>
    :root {
      --bg-color: #fcf8f6;
      --her-color: #ff8fa3;
      --her-bg: #fff0f3;
      --his-color: #4ea8de;
      --his-bg: #edf6f9;
      --text-main: #4a4e69;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 25px; }
    h1 { font-size: 2.2rem; color: #333; font-weight: 700; }

    .sync-badge {
      display: inline-block;
      padding: 4px 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .dashboards { display: flex; gap: 20px; margin-bottom: 30px; }
    .card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }
    .card.her { border-top: 5px solid var(--her-color); }
    .card.his { border-top: 5px solid var(--his-color); }

    .profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .avatar-wrapper { position: relative; width: 70px; height: 70px; }
    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%; object-fit: cover;
      background: #eee; cursor: pointer;
    }
    .file-input { display: none; }

    .meter-group { margin-bottom: 15px; }
    .meter-label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 5px; }
    input[type=range] { width: 100%; accent-color: var(--her-color); cursor: pointer; }
    .his input[type=range] { accent-color: var(--his-color); }

    .calendar-section { background: #fff; padding: 20px; border-radius: 18px; margin-bottom: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; margin-top: 15px; }
    .day-header { font-weight: bold; color: #999; padding-bottom: 5px; }
    .day-cell {
      padding: 12px 5px; border-radius: 10px; background: #f9f9f9; cursor: pointer; position: relative;
    }
    .day-cell.today { border: 2px solid var(--her-color); font-weight: bold; }

    .diaries { display: flex; gap: 15px; }
    .diary-tab {
      flex: 1; background: #fff; padding: 15px; border-radius: 15px; cursor: pointer; text-align: center; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .diary-tab.active { background: var(--her-bg); color: var(--her-color); border: 1px solid var(--her-color); }

    .diary-content { background: #fff; border-radius: 18px; padding: 20px; margin-top: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
    textarea { 
      width: 100%; 
      height: 140px; 
      border: 1px solid #ddd; 
      border-radius: 10px; 
      padding: 12px; 
      font-family: 'Nunito', sans-serif; 
      font-size: 1rem;
      margin-bottom: 10px; 
      resize: vertical;
    }
    button { background: var(--her-color); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    
    @media (max-width: 768px) {
      .dashboards, .diaries { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Our Shared Space 💕</h1>
    <div class="sync-badge" id="syncStatus">☁️ Syncing with Cloud...</div>
  </header>

  <main>
    <div class="dashboards">
      <!-- ruoruo -->
      <div class="card her">
        <div class="profile">
          <div class="avatar-wrapper" onclick="document.getElementById('herAvatarInput').click()">
            <img id="herAvatar" class="avatar" src="https://via.placeholder.com/70" alt="ruoruo Avatar">
            <input type="file" id="herAvatarInput" class="file-input" accept="image/*" onchange="uploadAvatar('her', this)">
          </div>
          <div>
            <h3>ruoruo</h3>
            <small>Click avatar to change photo</small>
          </div>
        </div>
        <div class="meter-group">
          <div class="meter-label"><span>Love Index</span><span id="herLoveVal">80%</span></div>
          <input type="range" id="herLove" min="0" max="100" value="80" oninput="updateMeter('herLove', this.value)">
        </div>
        <div class="meter-group">
          <div class="meter-label"><span>Hate / Annoyed</span><span id="herHateVal">10%</span></div>
          <input type="range" id="herHate" min="0" max="100" value="10" oninput="updateMeter('herHate', this.value)">
        </div>
      </div>

      <!-- louis hey pig -->
      <div class="card his">
        <div class="profile">
          <div class="avatar-wrapper" onclick="document.getElementById('hisAvatarInput').click()">
            <img id="hisAvatar" class="avatar" src="https://via.placeholder.com/70" alt="louis hey pig Avatar">
            <input type="file" id="hisAvatarInput" class="file-input" accept="image/*" onchange="uploadAvatar('his', this)">
          </div>
          <div>
            <h3>louis hey pig 🐷</h3>
            <small>Click avatar to change photo</small>
          </div>
        </div>
        <div class="meter-group">
          <div class="meter-label"><span>Love Index</span><span id="hisLoveVal">85%</span></div>
          <input type="range" id="hisLove" min="0" max="100" value="85" oninput="updateMeter('hisLove', this.value)">
        </div>
        <div class="meter-group">
          <div class="meter-label"><span>Hate / Annoyed</span><span id="hisHateVal">5%</span></div>
          <input type="range" id="hisHate" min="0" max="100" value="5" oninput="updateMeter('hisHate', this.value)">
        </div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="calendar-section">
      <h3 id="calendarMonth">September 2026</h3>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Diaries -->
    <div class="diaries">
      <div class="diary-tab active" onclick="switchDiary('ruoruo')">ruoruo's diary 📖</div>
      <div class="diary-tab" onclick="switchDiary('louis')">Louis hey's diary 🐷</div>
      <div class="diary-tab" onclick="switchDiary('movies')">Movies 🎬</div>
    </div>

    <div class="diary-content">
      <textarea id="diaryText" placeholder="Write down your diary or movie notes here..."></textarea>
      <button onclick="saveDiary()">Save Diary</button>
    </div>
  </main>

  <script>
    let currentDiary = 'ruoruo';
    let localData = {};

    window.addEventListener('load', () => {
      renderCalendar();
      
      const checkFirebase = setInterval(() => {
        if (window.dbOnValue) {
          clearInterval(checkFirebase);
          initFirebaseSync();
        }
      }, 200);
    });

    function initFirebaseSync() {
      const spaceRef = window.dbRef(window.db, 'sharedSpace');
      window.dbOnValue(spaceRef, (snapshot) => {
        const data = snapshot.val() || {};
        localData = data;
        
        if(data.herLove !== undefined) setSlider('herLove', data.herLove);
        if(data.herHate !== undefined) setSlider('herHate', data.herHate);
        if(data.hisLove !== undefined) setSlider('hisLove', data.hisLove);
        if(data.hisHate !== undefined) setSlider('hisHate', data.hisHate);

        if(data.herAvatar) document.getElementById('herAvatar').src = data.herAvatar;
        if(data.hisAvatar) document.getElementById('hisAvatar').src = data.hisAvatar;

        if(data.diaries && data.diaries[currentDiary] !== undefined) {
          document.getElementById('diaryText').value = data.diaries[currentDiary];
        }

        document.getElementById('syncStatus').innerText = '🟢 Realtime Synced';
      });
    }

    function updateMeter(key, val) {
      document.getElementById(key + 'Val').innerText = val + '%';
      if(window.dbSet) {
        window.dbSet(window.dbRef(window.db, 'sharedSpace/' + key), val);
      }
    }

    function setSlider(id, val) {
      document.getElementById(id).value = val;
      document.getElementById(id + 'Val').innerText = val + '%';
    }

    function switchDiary(tab) {
      currentDiary = tab;
      document.querySelectorAll('.diary-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      const diaryVal = (localData.diaries && localData.diaries[tab]) ? localData.diaries[tab] : '';
      document.getElementById('diaryText').value = diaryVal;
    }

    function saveDiary() {
      const text = document.getElementById('diaryText').value;
      if(window.dbSet) {
        window.dbSet(window.dbRef(window.db, `sharedSpace/diaries/${currentDiary}`), text);
        alert('Diary synced to cloud!');
      }
    }

    function uploadAvatar(who, input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64 = e.target.result;
          document.getElementById(who + 'Avatar').src = base64;
          if(window.dbSet) {
            window.dbSet(window.dbRef(window.db, `sharedSpace/${who}Avatar`), base64);
          }
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      days.forEach(d => grid.innerHTML += `<div class="day-header">${d}</div>`);
      
      const today = new Date().getDate();
      for (let i = 1; i <= 30; i++) {
        const isToday = i === today ? 'today' : '';
        grid.innerHTML += `<div class="day-cell ${isToday}">${i}</div>`;
      }
    }
  </script>
</body>
</html>
